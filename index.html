<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Poprawny Test Lumii</title>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; }
        canvas { border: 2px solid #00ff00; background: #222; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Lokalny Test Wydajności (60 FPS)</h2>
    <div id="status" style="color: #00ff00;">Test lokalny - bez opóźnień sieciowych</div>
    
    <canvas id="canvas" width="400" height="300"></canvas>

    <script>
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        
        var x = 0;
        var y = 150;
        var dx = 3; // Prędkość kropki

        function animuj() {
            // Czyścimy płótno
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Tło testowe
            ctx.fillStyle = "#333";
            ctx.fillRect(10, 10, 380, 280);
            
            // Ruch kropki
            x += dx;
            if(x > canvas.width - 20 || x < 20) dx = -dx;
            
            // Rysowanie kropki
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI*2);
            ctx.fillStyle = "#00ff00";
            ctx.fill();
            ctx.closePath();
            
            // Modern requestAnimationFrame lub stary fallback dla starszych silników Trident
            if (window.requestAnimationFrame) {
                window.requestAnimationFrame(animuj);
            } else {
                setTimeout(animuj, 16);
            }
        }

        // Odpalamy lokalną animację
        animuj();
    </script>
</body>
</html>
